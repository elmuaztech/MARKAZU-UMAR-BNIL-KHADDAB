services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mssms_user:mssms_secure_pass_1447@postgres:5432/mssms_db?schema=public
      - NODE_ENV=production
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-markazuumarbnkhaddabdaneji@gmail.com}
      - SMTP_PASS=${SMTP_PASS}
      - EMAIL_MODE=${EMAIL_MODE:-production}
      - DEVELOPMENT_EMAIL_RECIPIENT=${DEVELOPMENT_EMAIL_RECIPIENT}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - SYSTEM_API_SECRET=${SYSTEM_API_SECRET:-MARKAZU_UMAR_INTERNAL_SECRET_2026}
    depends_on:
      - postgres
    restart: always

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mssms_user
      POSTGRES_PASSWORD: mssms_secure_pass_1447
      POSTGRES_DB: mssms_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata:
