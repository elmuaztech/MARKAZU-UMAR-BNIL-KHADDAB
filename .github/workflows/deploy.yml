name: Automated Deployment to Hostinger VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 82.29.168.139
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e
            cd /var/www/MARKAZU-UMAR-BNIL-KHADDAB
            git fetch origin main
            git reset --hard origin/main
            docker compose build
            docker compose up -d --remove-orphans
            docker compose exec -T app npx prisma@5 db push --skip-generate
            cat prisma/backfill.sql | docker compose exec -T postgres psql -U mssms_user -d mssms_db
            docker builder prune -f
            docker image prune -f
