# Nginx Reverse Proxy Configuration for Markazu Umar School Management System (MSSMS)
# Hostinger VPS Deployment (Ubuntu LTS / KVM 1)

upstream nextjs_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    server_name mubkdaneji.com www.mubkdaneji.com;

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name mubkdaneji.com www.mubkdaneji.com;

    # Let's Encrypt SSL Certificates (Generated via Certbot)
    ssl_certificate /etc/letsencrypt/live/mubkdaneji.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mubkdaneji.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Next.js Static Files Caching
    location /_next/static {
        proxy_pass http://nextjs_upstream;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
    }

    # Proxy All Application Requests
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
